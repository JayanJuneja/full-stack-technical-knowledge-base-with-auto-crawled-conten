  <main>
    <h1>Configuration</h1>
    <ul>
      <li><code>visibility_timeout</code> &ndash; seconds before an unacknowledged message is redelivered (default 30).</li>
      <li><code>max_retries</code> &ndash; deliveries before a message moves to the dead-letter queue (default 5).</li>
      <li><code>prefetch</code> &ndash; messages buffered per consumer (default 10).</li>
    </ul>
  </main>
</body>
